services:
  - type: web
    name: meteoprecisa-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: CACHE_BACKEND
        value: local
      - key: CACHE_REFRESH_SECONDS
        value: "60"
      - key: ENABLE_IN_PROCESS_SYNC
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.11.9"
