name: CI/CD Despliegue Automático a Google Cloud & Firebase (Santiago)

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Compilar y Desplegar a Santiago de Chile (southamerica-west1)
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_NODE20: true

    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Compilar Frontend React
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Desplegar Backend a Cloud Run (Santiago de Chile)
        run: |
          gcloud run deploy meteoprecisa-app \
            --source . \
            --region southamerica-west1 \
            --allow-unauthenticated

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools@13.33.0 --no-fund

      - name: Desplegar a Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --project gen-lang-client-0695066948 --token "$FIREBASE_TOKEN"
