name: Sincronizacion Horaria Automatica (GitHub Actions)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sincronizar Estaciones y GOES-19
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Codigo
        uses: actions/checkout@v4

      - name: Ping al Backend en Render para mantenerlo activo
        run: |
          curl -s --max-time 30 https://meteoprecisa-backend.onrender.com/ || echo "Backend inicializando"
