name: CI Verificación de Calidad y Pruebas

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Pruebas Unitarias y Validación de Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias Backend
        run: |
          pip install -r requirements.txt

      - name: Ejecutar Pruebas Automatizadas (Pytest)
        run: |
          python -m pytest

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Compilar Frontend React (Vite)
        run: |
          cd frontend
          npm ci || npm install
          npm run build
